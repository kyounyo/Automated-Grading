server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large rubric / submission uploads
    client_max_body_size 200m;

    # API requests go to the FastAPI backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI grading requests can take several minutes
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_buffering off;
    }

    # Uploaded files served by the backend
    location /static/uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Interactive API docs (http://localhost:8080/docs)
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Cache built JS/CSS assets (their filenames contain a content hash)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: send every other path to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
